version: "3.1"

intents:
  - greet
  - goodbye
  - file_complaint
  - inform
  - check_status
  - affirm
  - deny
  - out_of_scope
  - bot_challenge

entities:
  - crime_type
  - location
  - date
  - complaint_id

slots:
  crime_type:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: crime_type

  description:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        conditions:
          - active_loop: complaint_form
            requested_slot: description

  location:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: location
      - type: from_text
        conditions:
          - active_loop: complaint_form
            requested_slot: location

  date:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: date
      - type: from_text
        conditions:
          - active_loop: complaint_form
            requested_slot: date

  complaint_id:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text

  sentiment:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  sentiment_score:
    type: float
    influence_conversation: false
    mappings:
      - type: custom

  emotion:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  urgency_level:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  urgency_score:
    type: float
    influence_conversation: false
    mappings:
      - type: custom

responses:
  utter_greet:
    - text: "Hello! Welcome to the Crime Complaint System. How can I assist you today?"
  
  utter_goodbye:
    - text: "Goodbye! Stay safe. Feel free to reach out anytime you need help."
  
  utter_ask_description:
    - text: "Please describe what happened in detail."
  
  utter_ask_location:
    - text: "Where did this incident occur? Please provide the location."
  
  utter_ask_date:
    - text: "When did this happen? (You can say 'today', 'yesterday', or provide a date)"
  
  utter_iamabot:
    - text: "I am a bot, powered by Rasa, designed to help you file complaints."
  
  utter_out_of_scope:
    - text: "I'm sorry, I can only help with filing complaints and checking complaint status. How can I assist you with that?"

actions:
  - action_save_complaint
  - validate_complaint_form
  - action_detect_sentiment

forms:
  complaint_form:
    required_slots:
      - description
      - location
      - date

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

