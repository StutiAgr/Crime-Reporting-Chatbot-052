version: "3.1"

rules:
  - rule: Say goodbye anytime the user says goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Say utter_iamabot anytime user challenges
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  - rule: Out of scope
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope

  - rule: Activate complaint form with sentiment detection
    steps:
      - intent: file_complaint
      - action: action_detect_sentiment
      - action: complaint_form
      - active_loop: complaint_form

  - rule: Submit complaint form
    condition:
      - active_loop: complaint_form
    steps:
      - action: complaint_form
      - active_loop: null
      - action: action_save_complaint